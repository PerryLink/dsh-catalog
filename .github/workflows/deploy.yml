name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - '.vercelignore'
      - 'deploy/**'
      - 'scripts/build-catalog.mjs'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "SKIP vercel: VERCEL_TOKEN secret not set"
            exit 0
          fi
          node scripts/build-icons.mjs
          node scripts/build-catalog.mjs https://perrylink-dsh-catalog.vercel.app
          node scripts/validate.mjs
          npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "SKIP cloudflare: CLOUDFLARE_API_TOKEN secret not set"
            exit 0
          fi
          echo "account id prefix: ${CLOUDFLARE_ACCOUNT_ID:0:8}"
          echo "--- workers.dev subdomain state ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo
          echo "--- ensure subdomain registered (fallback names) ---"
          for SUB in perrylink perrylink-dsh perrylink-dev; do
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$SUB\"}"
            echo
          done
          node scripts/build-icons.mjs
          cd deploy
          npx -y wrangler@latest deploy --config wrangler.toml 2>&1 | tee /tmp/workers.log || true
          URL="$(grep -oE 'https://perrylink-dsh-catalog\.[a-z0-9-]+\.workers\.dev' /tmp/workers.log | head -1 || true)"
          CHANNEL=workers
          if [ -z "$URL" ]; then
            echo "workers.dev unavailable, falling back to Cloudflare Pages"
            npx -y wrangler@latest pages project create perrylink-dsh-catalog --production-branch main 2>&1 | tee /tmp/pages-create.log || true
            npx -y wrangler@latest pages deploy . --project-name=perrylink-dsh-catalog 2>&1 | tee /tmp/pages.log || true
            URL="$(grep -oE 'https://perrylink-dsh-catalog\.pages\.dev' /tmp/pages.log | head -1 || true)"
            CHANNEL=pages
          fi
          cd ..
          if [ -n "$URL" ]; then
            echo "deployed URL: $URL (channel $CHANNEL)"
            node scripts/build-catalog.mjs "$URL"
            node scripts/validate.mjs
            cd deploy
            if [ "$CHANNEL" = workers ]; then
              npx -y wrangler@latest deploy --config wrangler.toml
            else
              npx -y wrangler@latest pages deploy . --project-name=perrylink-dsh-catalog
            fi
            cd ..
            echo "--- live smoke ---"
            curl -fsS "$URL/catalog-source.json" -o /tmp/manifest.json
            grep -q "$URL/v1/plugins" /tmp/manifest.json
            curl -fsS "$URL/v1/plugins" -o /tmp/plugins.json
            node -e "const j=require('/tmp/plugins.json');if(!Array.isArray(j.items)||j.items.length<34)throw new Error('unexpected items: '+(j.items&&j.items.length));if(!j.items.every(i=>i.media&&i.media.icon&&i.media.icon.url))throw new Error('missing media.icon');console.log('plugins ok:',j.items.length,'items, all with media.icon')"
            curl -fsS "$URL/icons/dsh-auto-review.png" -o /tmp/icon.png
            node -e "const b=require('fs').readFileSync('/tmp/icon.png');if(!b.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))throw new Error('bad png signature');console.log('icon ok:',b.length,'bytes')"
            echo "live smoke ok: $URL"
          else
            echo "ERROR: no deploy URL obtained from wrangler output"
            exit 1
          fi
