name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - '.vercelignore'
      - 'deploy/**'
      - 'scripts/build-catalog.mjs'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "SKIP vercel: VERCEL_TOKEN secret not set"
            exit 0
          fi
          node scripts/build-catalog.mjs https://perrylink-dsh-catalog.vercel.app
          node scripts/validate.mjs
          npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "SKIP cloudflare: CLOUDFLARE_API_TOKEN secret not set"
            exit 0
          fi
          echo "--- workers.dev subdomain state ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo
          echo "--- ensure subdomain registered (fallback names) ---"
          for SUB in perrylink perrylink-dsh perrylink-dev; do
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$SUB\"}"
            echo
          done
          cd deploy
          npx -y wrangler@latest deploy --config wrangler.toml 2>&1 | tee /tmp/wrangler.log
          URL="$(grep -oE 'https://perrylink-dsh-catalog\.[a-z0-9-]+\.workers\.dev' /tmp/wrangler.log | head -1)"
          cd ..
          if [ -n "$URL" ]; then
            echo "workers.dev URL: $URL"
            node scripts/build-catalog.mjs "$URL"
            node scripts/validate.mjs
            cd deploy
            npx -y wrangler@latest deploy --config wrangler.toml
          else
            echo "ERROR: could not parse workers.dev URL from wrangler output"
            exit 1
          fi
