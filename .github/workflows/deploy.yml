name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - '.vercelignore'
      - 'scripts/build-catalog.mjs'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild catalog with the live origin
        run: node scripts/build-catalog.mjs https://perrylink-dsh-catalog.vercel.app
      - name: Validate artifacts
        run: node scripts/validate.mjs
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "SKIP deploy: VERCEL_TOKEN secret not set"
            exit 0
          fi
          npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
